name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip and build
        run: |
          for z in *.zip; do unzip -o "$z" -d app; done
          DIR=$(dirname "$(find app -name build.gradle | head -1)")
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/hvhclient-*[0-9].jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: hvhclient
          path: out/*.jar
